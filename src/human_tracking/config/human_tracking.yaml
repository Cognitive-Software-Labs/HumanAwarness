human_tracking_node:
  ros__parameters:
    image_topic: /camera/image_raw
    detections_topic: human_perception/detections
    tracked_topic: human_tracking/tracked_detections
    sync_slop_s: 0.05
    reid_weights_path: ""
    reid_model: osnet_x1_0  # osnet_x1_0 | osnet_ain_x1_0
    reid_normalize: false  # ImageNet mean/std input normalization
    device: cpu
    gallery_size: 8
    iou_threshold: 0.3
    reid_threshold: 0.65
    reid_margin: 0.08
    max_speed_bbox_heights_per_sec: 3.0
    confirm_frames: 3
    kalman_timeout_s: 2.5
    gallery_timeout_s: 45.0
    reconcile_window_s: 1.5
    density_threshold_step: 0.05
    density_margin_step: 0.05
    orientation_relief: 0.12
    containment_suppression_threshold: 0.9
    torso_rescue_weight: 0.4
    reconcile_heading_rank_weight: 0.15
    reconcile_orientation_rank_weight: 0.12
    cooccurrence_veto: true
    cooccurrence_max_overlap: 0.5
    bystander_negative_check: false
    bystander_margin: 0.0
    # stage-1 motion/IoU assignment: greedy | hungarian (hungarian needs scipy)
    assignment_method: greedy
    edge_embedding_sides: "off"
    edge_embedding_margin_px: 2.0
    edge_defers_reconcile_window: true
